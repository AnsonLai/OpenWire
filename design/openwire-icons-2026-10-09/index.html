<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenWire — Six icon directions</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f4f3ed; color: #14201c; font-family: system-ui, sans-serif; }
  main { max-width: 1120px; margin: auto; padding: 44px 28px; }
  .eyebrow { color: #087f61; font-size: 12px; letter-spacing: .12em; font-weight: 700; text-transform: uppercase; }
  h1 { font-size: clamp(28px, 5vw, 44px); letter-spacing: -.045em; margin: 10px 0; }
  .intro { color: #5b665f; line-height: 1.6; max-width: 660px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 24px 0; }
  button { font: inherit; border: 1px solid #ccd3cc; background: transparent; color: inherit; padding: 8px 14px; border-radius: 30px; cursor: pointer; }
  button[aria-pressed="true"] { color: #fff; background: #14201c; border-color: #14201c; }
  button:focus-visible, a:focus-visible { outline: 3px solid #0aa77b; outline-offset: 4px; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
  article { border: 1px solid #dfe3db; background: #fffefa; border-radius: 20px; padding: 24px; }
  .large { display: block; width: 172px; height: 172px; margin: 8px auto 28px; }
  img { object-fit: contain; border-radius: 23%; }
  body[data-shape="circle"] img { border-radius: 50%; }
  body[data-shape="square"] img { border-radius: 0; }
  h2 { font-size: 18px; letter-spacing: -.02em; margin: 0 0 8px; }
  .description { font-size: 14px; color: #5b665f; line-height: 1.55; margin: 0; min-height: 66px; }
  .sizes { display: flex; gap: 24px; align-items: flex-end; margin: 20px 0; }
  figure { margin: 0; text-align: center; }
  figure img { display: block; margin: auto; }
  figcaption { font-size: 11px; color: #667269; margin-top: 7px; }
  a { color: #087f61; font-size: 13px; font-weight: 600; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .footer { margin-top: 26px; color: #667269; font-size: 13px; line-height: 1.6; }
  @media(max-width: 840px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media(max-width: 540px) { main { padding: 28px 18px; } .grid { grid-template-columns: 1fr; } }
</style>
<body data-shape="rounded">
<main>
  <div class="eyebrow">OpenWire · Icon studies</div>
  <h1>Six directions. One news wire.</h1>
  <p class="intro">Compare the larger artwork with actual 48, 32, and 16 pixel previews. Try different app-icon masks to judge balance and readability.</p>
  <div class="controls" role="group" aria-label="Icon mask">
    <button type="button" data-mask="rounded" aria-pressed="true">Rounded square</button>
    <button type="button" data-mask="circle" aria-pressed="false">Circle</button>
    <button type="button" data-mask="square" aria-pressed="false">Square</button>
  </div>
  <div class="grid" id="concepts"></div>
  <p class="footer">Original PNG concepts generated with the built-in imagegen tool. <a href="prompts.json">View the full prompt set</a>.</p>
</main>
<script>
const concepts = [
  ['01-open-ring', '01 · Open ring', 'A cleaner evolution of the current mark: one open ring and one wire.'],
  ['02-wire-w', '02 · Wire W', 'A continuous wire forms a bold W. Simple, balanced, and easy to recognize.'],
  ['03-editorial-cards', '03 · Editorial cards', 'Stacked headline cards give the mark a clear connection to news.'],
  ['04-signal', '04 · Signal', 'Concentric arcs and an outgoing wire suggest a live news signal.'],
  ['05-woven-loops', '05 · Woven loops', 'Two interwoven loops suggest connected sources and open information.'],
  ['06-ow-monogram', '06 · OW monogram', 'A compact custom monogram brings the OpenWire initials together.'],
];
const grid = document.querySelector('#concepts');
for (const [file, title, description] of concepts) {
  const card = document.createElement('article');
  const source = file + '.png';
  card.innerHTML = `<img class="large" src="${source}" alt="${title} icon concept" width="172" height="172"><h2>${title}</h2><p class="description">${description}</p><div class="sizes">${[48, 32, 16].map(size => `<figure><img src="${source}" alt="${size} pixel preview" width="${size}" height="${size}"><figcaption>${size} px</figcaption></figure>`).join('')}</div><a href="${source}" download>Download original PNG ↗</a>`;
  grid.appendChild(card);
}
for (const button of document.querySelectorAll('[data-mask]')) {
  button.addEventListener('click', () => {
    document.body.dataset.shape = button.dataset.mask;
    for (const other of document.querySelectorAll('[data-mask]')) other.setAttribute('aria-pressed', String(other === button));
  });
}
</script>
</body>
</html>
