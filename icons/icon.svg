<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="ow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>
  <!-- Rounded App Tile Background -->
  <rect width="512" height="512" rx="112" fill="url(#ow-grad)" />

  <!-- OpenWire Monogram -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Open 'O' Outer Ring -->
    <path d="M 346.3 205.15 A 116 116 0 1 0 346.3 306.85" stroke-width="28" />
    
    <!-- Top Headline Line -->
    <line x1="180" y1="205" x2="290" y2="205" stroke-width="20" />
    
    <!-- The Open Wire (streaming out through the break) -->
    <line x1="175" y1="256" x2="386" y2="256" stroke-width="28" />
    
    <!-- Bottom Headline Line -->
    <line x1="180" y1="307" x2="265" y2="307" stroke-width="20" />
  </g>
</svg>
